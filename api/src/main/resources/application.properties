spring.application.name=educa-mais-api

# 0.0.0.0 deixa o celular (na mesma Wi-Fi) acessar a API pelo IP do computador
server.port=8080
server.address=0.0.0.0

# Banco criado pelos scripts da pasta banco/. Troque usuário e senha pelos do seu MySQL
# (ou defina as variáveis de ambiente DB_USER e DB_PASS).
spring.datasource.url=jdbc:mysql://localhost:3306/educa_mais?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:1234}

# O schema vem do script SQL (tem gatilhos, procedure e views), então o JPA não mexe nas tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

educa.escola=Escola Horizonte
