<title>Educa+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: um app vertical (portrait) — mundo de ilhas num mar que rola para baixo; área adulta usa o mesmo mar em cartões calmos */
:root{
  color-scheme: light;
  --outer:#0E4A72; --outer-2:#0B3A5B;
  --sea:#3EC1EC; --sea-2:#1E95CF; --foam:#E9FAFF;
  --sky:#EAF8FF;
  --ink:#1B2350; --ink-2:#4A5684; --ink-3:#8790B5;
  --paper:#FFFFFF; --line:#DFE6F3; --mist:#F2F6FC; --adult-bg:#F2F6FB;
  --sand:#FFD88A; --grass:#5FD38D;
  --star:#FFC21A; --star-2:#E58A00; --star-bg:#FFF4CC;
  --good:#1FAE64; --good-dk:#168A4F; --good-bg:#E0F7EA;
  --try:#FF8A1F; --try-bg:#FFF0DF; --try-ink:#8A4300;
  --bad:#E5484D; --tico:#2BC4B4;
  --mat:#FF7A1A; --por:#8B5CF6; --cie:#1FB866; --his:#E0533D; --geo:#2D7FF9; --ing:#EC4899;
  --f-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:16px;display:flex;justify-content:center;align-items:center;overflow:hidden;
  background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.07) 0 60px,transparent 61px),radial-gradient(circle at 85% 75%,rgba(255,255,255,.06) 0 90px,transparent 91px)}
#app{position:relative;width:100%;max-width:440px;height:100%;background:var(--sky);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){#app{height:min(900px,calc(100% - 48px));border-radius:38px;box-shadow:0 30px 80px rgba(0,20,50,.5),0 0 0 10px var(--outer-2)}}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--star);outline-offset:2px}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--f-display)}
.st{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
.st.on{fill:var(--star);stroke:var(--star-2);stroke-width:1.2}
.st.off{fill:rgba(27,35,80,.14)}
.s3{display:inline-flex;gap:1px}
.ic{width:24px;height:24px;flex:none}
.em{font-size:40px;line-height:1}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- botões ---------- */
.btn{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1;border-radius:20px;padding:12px 20px;min-height:58px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--b,var(--mat));color:#fff;box-shadow:0 5px 0 var(--bs,rgba(0,0,0,.22));transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bs,rgba(0,0,0,.22))}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #CBDDEE}
.btn.sm{min-height:44px;font-size:16px;padding:8px 14px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.round-btn{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(27,35,80,.12);flex:none}
.round-btn.sm{width:40px;height:40px;border-radius:12px;box-shadow:none;background:var(--mist)}

/* ---------- login ---------- */
.login{height:100%;background:linear-gradient(180deg,#68D4F6 0%,#36B6E6 55%,#1E92CC 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;position:relative;overflow:hidden;padding-block:24px}
.login .logo{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;color:#fff;letter-spacing:-1px;text-shadow:0 5px 0 rgba(10,60,110,.35)}
.login .logo span{color:var(--star)}
.login .tag{font-family:var(--f-display);font-weight:700;font-size:24px;color:#fff;max-width:16ch;line-height:1.15}
.login .hero{position:relative;width:240px;height:200px}
.login .hero .isl-svg{position:absolute;inset:auto 0 0 0;width:240px;height:180px}
.login .hero .tico{position:absolute;width:96px;height:96px;left:72px;top:6px;animation:hop 1.8s ease-in-out infinite}
.gbtn{background:#fff;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:20px;border-radius:20px;min-height:62px;padding:10px 26px;display:inline-flex;align-items:center;gap:12px;box-shadow:0 6px 0 rgba(10,60,110,.35)}
.gbtn .g{width:30px;height:30px;border-radius:50%;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0);display:grid;place-items:center}
.gbtn .g i{width:18px;height:18px;border-radius:50%;background:#fff;display:block}
.login small{color:rgba(255,255,255,.9);font-weight:700;font-size:13px;max-width:30ch}
.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.85}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:44%;height:160%;left:16%;bottom:20%}
.cloud::after{width:34%;height:130%;right:16%;bottom:24%}
.acc-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.acc{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:16px;border:2px solid var(--line);background:#fff}
.acc:active{background:var(--mist)}
.acc b{display:block;font-size:16px}
.acc small{color:var(--ink-2);font-weight:600;font-size:13px;word-break:break-all}
.acc .who{margin-left:auto;font-size:12px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap}

/* ---------- topo e navegação infantil ---------- */
.ktop{display:flex;align-items:center;gap:10px;padding-block:10px;background:#fff;border-bottom:3px solid #D2ECFA;position:relative;z-index:3}
.ktop .mini{width:48px;height:48px;border-radius:50%;background:#FFE9C7;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2.5px var(--star);flex:none}
.ktop .mini .av{width:100%;height:100%;transform:scale(1.55) translateY(14%)}
.ktop .hi{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.ktop .hi small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-2);font-weight:700}
.ktop h1{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.05;flex:1;min-width:0}
.wallet{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--star-bg);border:2.5px solid var(--star);border-radius:99px;padding:3px 12px 3px 8px;font-family:var(--f-display);font-weight:800;font-size:20px;color:#8A5200;font-variant-numeric:tabular-nums;flex:none}
.wallet .st{width:24px;height:24px}
.knav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:3px solid #D2ECFA;padding:6px 4px 8px;flex:none;position:relative;z-index:3}
.knav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--ink-3);padding:4px 0}
.knav .bub{width:50px;height:36px;border-radius:14px;display:grid;place-items:center;transition:transform .18s,background .18s}
.knav button.on{color:var(--ink)}
.knav button.on .bub{background:var(--k);color:#fff;transform:translateY(-3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}

/* ---------- mapa ---------- */
.sea{position:relative;background:linear-gradient(180deg,#5CD0F4 0%,#33B4E6 40%,#1F96D0 100%);overflow:hidden}
.sea::before{content:"";position:absolute;inset:0;background-image:radial-gradient(ellipse 16px 4px at 50% 50%,rgba(255,255,255,.45) 60%,transparent 64%);background-size:96px 64px;background-position:0 0,48px 32px;opacity:.55;pointer-events:none}
.sea .route{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.mission{position:relative;z-index:2;margin-top:14px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:10px 12px;box-shadow:0 5px 0 rgba(0,50,90,.18);text-align:left;width:100%}
.mission .tico{width:54px;height:54px;flex:none}
.mission b{font-family:var(--f-display);font-size:17px;line-height:1.1;display:block}
.mission small{font-weight:700;color:var(--ink-2);font-size:13px;line-height:1.3;display:block}
.mission .go{margin-left:auto;width:42px;height:42px;border-radius:14px;background:var(--mc,var(--mat));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.mission.alert{background:#EAF2FF;border:2.5px dashed #6E9CFF}
.isl{position:absolute;width:172px;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);z-index:2}
.isl .isl-svg{width:172px;height:129px;animation:bob 4.2s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,40,90,.16));transition:transform .15s}
.isl:nth-child(even) .isl-svg{animation-delay:-2s}
.isl:active .isl-svg{transform:scale(.93)}
.plate{display:block;background:#fff;border-radius:18px;padding:6px 14px 9px;margin-top:-12px;box-shadow:0 4px 0 rgba(0,50,90,.2);text-align:center;min-width:140px;border:3px solid var(--c)}
.plate b{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1.15;color:var(--c);display:block;text-transform:uppercase}
.plate .s3{font-size:20px;margin:1px 0}
.plate small{display:block;font-weight:800;font-size:12.5px;color:var(--ink-2)}
.pbar{display:block;height:9px;border-radius:99px;background:#E6EDF7;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--c);border-radius:inherit}
.me-on-map{position:absolute;width:74px;z-index:3;transform:translateX(-50%);pointer-events:none;text-align:center}
.me-on-map .av{width:74px;height:90px;animation:hop 2.4s ease-in-out infinite}
.me-on-map span{display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:11px;border-radius:99px;padding:2px 8px;margin-top:-4px}
.empty-map{position:relative;z-index:2;background:#fff;border-radius:22px;padding:20px;text-align:center;margin-top:30px;font-weight:700}

/* ---------- ilha ---------- */
.scene{position:relative;background:linear-gradient(180deg,#5CD0F4,#2EA9E0);padding-block:12px 18px;overflow:hidden;text-align:center}
.scene .isl-svg{width:290px;height:218px;max-width:100%;animation:bob 5s ease-in-out infinite}
.scene .me{position:absolute;width:70px;height:86px;left:calc(50% + 70px);top:92px;animation:hop 2.2s ease-in-out infinite}
.scene .iname{font-family:var(--f-display);font-weight:800;font-size:28px;color:#fff;text-shadow:0 3px 0 rgba(0,60,110,.35);line-height:1}
.scene .isub{color:#fff;font-weight:800;opacity:.95;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.statrow{display:flex;gap:10px;margin-top:-18px;position:relative;z-index:2}
.stat{flex:1;background:#fff;border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 rgba(27,35,80,.1);min-width:0}
.stat b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.stat small{font-weight:700;color:var(--ink-2);font-size:13px}
.regions{display:flex;flex-direction:column;gap:12px}
.region{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px;text-align:left;box-shadow:0 4px 0 rgba(27,35,80,.1);width:100%}
.region .rb{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:#fff;background:var(--c);flex:none}
.region.locked .rb{background:#C9D3E5}
.region b{font-family:var(--f-display);font-size:18px;line-height:1.1;display:block}
.region small{font-weight:700;color:var(--ink-2);font-size:13px}
.region .tagx{margin-left:auto;font-weight:800;font-size:12px;border-radius:99px;padding:4px 10px;white-space:nowrap}

/* ---------- trilha de níveis ---------- */
.trail{position:relative;background:linear-gradient(180deg,#C9F0B5 0%,#9FE08A 100%)}
.trail::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.35) 0 3px,transparent 4px);background-size:44px 44px;pointer-events:none}
.trail .route{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:30px;color:#fff;background:var(--c);box-shadow:0 7px 0 rgba(0,0,0,.22),inset 0 -6px 0 rgba(0,0,0,.12);z-index:2}
.node .s3{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:20px;background:#fff;border-radius:99px;padding:1px 6px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.node.locked{background:#B9C4D8;color:#fff}
.node.cur{width:90px;height:90px;font-size:36px;animation:pulse 1.6s ease-in-out infinite}
.node.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid #fff;opacity:.9}
.node .me{position:absolute;width:62px;height:76px;bottom:72px;left:50%;transform:translateX(-50%);animation:hop 2s ease-in-out infinite;pointer-events:none}
.sign{position:absolute;z-index:1;background:#7A4E26;color:#FFF3D6;font-family:var(--f-display);font-weight:800;font-size:14px;padding:5px 12px;border-radius:10px;box-shadow:0 4px 0 #5A3818;transform:translateX(-50%);white-space:nowrap}
.sign::after{content:"";position:absolute;left:50%;top:100%;width:6px;height:16px;background:#5A3818;transform:translateX(-50%)}
.startflag{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;color:#2C6B1C;font-size:15px;letter-spacing:.12em}

/* ---------- atividade ---------- */
.act{display:flex;flex-direction:column;height:100%;background:var(--soft,#EAF8FF)}
.act-top{display:flex;align-items:center;gap:10px;padding-block:10px;flex:none}
.dots{flex:1;display:flex;gap:6px;min-width:0}
.dots i{flex:1;height:13px;border-radius:99px;background:rgba(27,35,80,.12);transition:background .3s}
.dots i.done{background:var(--c)}
.dots i.cur{background:var(--c);opacity:.4}
.hintbtn{display:flex;align-items:center;gap:4px;background:#fff;border-radius:16px;padding:4px 12px 4px 4px;height:46px;font-family:var(--f-display);font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(27,35,80,.12);flex:none}
.hintbtn .tico{width:38px;height:38px}
.act-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:4px 10px}
.qcard{background:#fff;border-radius:26px;padding:16px;box-shadow:0 5px 0 rgba(27,35,80,.08);text-align:center}
.prompt{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.2;text-wrap:balance}
.prompt.long{font-size:19px;line-height:1.28;font-family:var(--f-body);font-weight:800}
.visual{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:12px;font-size:34px;line-height:1}
.visual:empty{display:none}
.visual .it{display:inline-block;animation:popin .35s both}
.visual .op{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--ink-2);margin:0 4px}
.visual .eq{font-family:var(--f-display);font-weight:800;font-size:40px;color:var(--ink);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.grp{display:inline-flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:150px;padding:8px;border-radius:18px;background:var(--soft,#EAF8FF)}
.apples{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:280px}
.apples .gone{opacity:.25;transform:scale(.8) rotate(-12deg);transition:all .4s}
.friendtag{font-size:14px;font-weight:800;color:var(--ink-2);width:100%;margin-top:4px}
.plates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.plates .grp{font-size:24px;max-width:96px;border-radius:50%;padding:12px 10px;background:#FFF1DC;border:3px solid #FFD6A0}
.seq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seq span{min-width:58px;height:58px;border-radius:16px;background:var(--soft,#EAF8FF);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;padding:0 6px}
.seq span.q{background:var(--c);color:#fff}
.shape{width:120px;height:120px}
.pizza{width:150px;height:150px;border-radius:50%;border:7px solid #E8B36A;background:repeating-conic-gradient(from 0deg,transparent 0 calc(360deg / var(--n) - 1.6deg),#fff calc(360deg / var(--n) - 1.6deg) calc(360deg / var(--n))),conic-gradient(var(--mat) 0 var(--k),#FFE6BF var(--k) 360deg)}
.gmap{display:grid;grid-template-columns:repeat(3,64px);gap:6px;padding:8px;border-radius:18px;background:#D8F1C8;font-size:34px}
.gmap span{height:64px;border-radius:12px;background:rgba(255,255,255,.65);display:grid;place-items:center}
.gmap span.mid{background:#fff;box-shadow:0 0 0 3px var(--geo)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,1),1fr)}
.opt{background:#fff;border-radius:22px;min-height:76px;font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--ink);box-shadow:0 5px 0 var(--oc,#C9D8EA);border:3px solid var(--oc,#C9D8EA);padding:8px 12px;transition:transform .08s;font-variant-numeric:tabular-nums;line-height:1.1}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--oc)}
.opt.txt{font-size:20px;min-height:62px}
.opt.emo{font-size:46px}
.opt.sw{min-height:84px}
.opt.sw i{display:block;width:100%;height:56px;border-radius:14px}
.opt.right{background:var(--good);border-color:var(--good-dk);color:#fff;box-shadow:0 5px 0 var(--good-dk);animation:pop .4s}
.opt.no{opacity:.32;pointer-events:none;box-shadow:none;transform:translateY(3px)}
.opt.shake,.tile.shake,.bin.shake,.card-ord.shake{animation:shake .45s}
.slots{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.slot{width:48px;height:58px;border-radius:14px;border:3px dashed var(--c);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--ink)}
.slot.f{border-style:solid;background:var(--soft);animation:popin .25s}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{width:62px;height:62px;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--oc,#C9D8EA);border:3px solid var(--oc,#C9D8EA);font-family:var(--f-display);font-weight:800;font-size:30px}
.tile.used{visibility:hidden}
.sort-item{display:flex;flex-direction:column;align-items:center;gap:2px;margin:10px auto 0;background:var(--soft);border-radius:22px;padding:12px 22px;animation:popin .3s}
.sort-item .em{font-size:64px}
.sort-item b{font-family:var(--f-display);font-size:22px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{min-height:150px;border-radius:24px;background:#fff;border:3px solid var(--oc,#C9D8EA);box-shadow:0 5px 0 var(--oc,#C9D8EA);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px}
.bin .bh{font-size:38px;line-height:1}
.bin b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.bin .got{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:24px;min-height:28px}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:12px;position:relative}
.tl-row{display:flex;align-items:center;gap:10px;border-radius:16px;border:3px dashed #CFD9EA;padding:6px 10px;min-height:54px;text-align:left}
.tl-row .n{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex:none}
.tl-row.f{border-style:solid;border-color:var(--c);background:var(--soft);animation:popin .25s}
.tl-row .em{font-size:28px}
.tl-row b{margin-left:auto;font-family:var(--f-display);font-size:16px;color:var(--c)}
.tl-row span:not(.n):not(.em){font-weight:800;font-size:15px;line-height:1.2}
.cards-ord{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card-ord{background:#fff;border-radius:18px;border:3px solid var(--oc,#C9D8EA);box-shadow:0 5px 0 var(--oc,#C9D8EA);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:15px;line-height:1.2;min-height:96px;justify-content:center}
.card-ord .em{font-size:34px}
.card-ord.used{visibility:hidden}
.act-foot{padding-block:6px 12px;flex:none}
.bubble{display:flex;align-items:flex-end;gap:8px}
.bubble .tico{width:60px;height:60px;flex:none}
.say{background:#fff;border-radius:22px 22px 22px 6px;padding:10px 14px;font-weight:700;font-size:16px;line-height:1.35;box-shadow:0 4px 0 rgba(27,35,80,.08);flex:1;min-width:0;animation:popin .25s}
.say b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.15}
.say.good{background:var(--good-bg);color:#0C6237}
.say.try{background:var(--try-bg);color:var(--try-ink)}
.say.hint{background:#FFF7D2;color:#6B5000}
.say.adapt{background:#E7F0FF;color:#1D3F95;border:2.5px dashed #79A5FF}
.say .ai{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:#2F62E8;color:#fff;border-radius:99px;padding:2px 8px;margin-bottom:4px}

/* ---------- resultado e recompensa ---------- */
.res{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-block:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 32%,#FFF7CF 0%,#FFDA6B 42%,#FFAE21 100%)}
.res h1{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;color:#fff;text-shadow:0 4px 0 #D97A00,0 0 18px rgba(255,255,255,.5)}
.bigstars{display:flex;align-items:flex-end;gap:4px;margin-block:4px}
.bigstars .st{width:74px;height:74px;animation:starin .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars .st:nth-child(2){width:96px;height:96px;margin-bottom:14px;animation-delay:.25s}
.bigstars .st:nth-child(3){animation-delay:.5s}
.bigstars .st.off{fill:rgba(255,255,255,.55);stroke:none}
.chips-res{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips-res span{background:rgba(255,255,255,.85);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px;color:#7A4400;font-variant-numeric:tabular-nums}
.res .bubble{max-width:340px;text-align:left}
.res .av{width:120px;height:146px;animation:jump 1s ease-in-out infinite}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:15px;border-radius:2px;animation:fall linear forwards}
.rew{background:radial-gradient(circle at 50% 30%,#5B74F5 0%,#3A49C9 55%,#26318F 100%)}
.rew h1{text-shadow:0 4px 0 #1A2366}
.chestwrap{position:relative;width:180px;height:150px}
.chest{width:180px;height:150px}
.chest .lid{transform-box:fill-box;transform-origin:0% 100%;animation:lid .7s .3s cubic-bezier(.3,1.6,.5,1) both}
.burst .st{position:absolute;left:50%;top:50%;width:30px;height:30px;animation:burst 1s .5s ease-out both}
.plus{font-family:var(--f-display);font-weight:800;font-size:46px;color:var(--star);text-shadow:0 4px 0 #8A5200;line-height:1;animation:starin .5s .8s both}
.unlock{background:rgba(255,255,255,.14);color:#fff;border-radius:18px;padding:10px 14px;font-weight:800;display:flex;align-items:center;gap:8px}
.suggest{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 14px;text-align:left;max-width:340px;width:100%}
.suggest .av{width:64px;height:78px;animation:none}
.suggest b{font-family:var(--f-display);font-size:17px;line-height:1.15;display:block}
.suggest small{font-weight:700;color:var(--ink-2);font-size:13px}

/* ---------- personagem e loja ---------- */
.stage{position:relative;padding-block:16px 4px;background:linear-gradient(180deg,#B9E9FF 0%,#DDF5FF 70%);text-align:center;overflow:hidden}
.stage::after{content:"";position:absolute;left:50%;bottom:-38px;width:280px;height:80px;border-radius:50%;background:#7CD98F;transform:translateX(-50%)}
.stage .av{width:190px;height:232px;position:relative;z-index:1}
.stage .av.pop{animation:pop .45s}
.stage .nm{position:relative;z-index:1;font-family:var(--f-display);font-weight:800;font-size:22px;margin-top:-10px}
.ktabs{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.ktabs::-webkit-scrollbar{display:none}
.ktab{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:16px;border-radius:16px;padding:8px 16px;background:#fff;box-shadow:0 3px 0 #CBDDEE;color:var(--ink-2)}
.ktab.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0C1233}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-block:10px 20px}
.item{position:relative;background:#fff;border-radius:20px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #CBDDEE;border:3px solid transparent;min-width:0}
.item .av{width:76px;height:92px}
.item b{font-family:var(--f-display);font-size:14px;line-height:1.1;text-align:center}
.item .price{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-display);font-weight:800;font-size:15px;color:#8A5200;font-variant-numeric:tabular-nums}
.item.eq{border-color:var(--good)}
.item .badge{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
.item .badge .ic{width:16px;height:16px}
.item.locked .av{opacity:.55}
.item .lockic{position:absolute;top:6px;right:6px;color:var(--ink-3)}
.item .lockic .ic{width:18px;height:18px}
.item .own{font-size:12px;font-weight:800;color:var(--good-dk)}
.item .short{font-size:12px;font-weight:800;color:var(--ink-3)}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding-block:8px}
.swatch{width:52px;height:52px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #CBDDEE}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.shophead{display:flex;align-items:center;gap:12px;padding-block:14px;background:linear-gradient(180deg,#FFE7A8,#FFF4D6)}
.shophead .big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;display:flex;align-items:center;gap:6px;color:#8A5200;font-variant-numeric:tabular-nums}
.shophead .big .st{width:40px;height:40px}
.shophead small{display:block;font-weight:800;color:#8A5200;font-size:13px}
.shophead .av{width:72px;height:88px;margin-left:auto}

/* ---------- progresso ---------- */
.kp-sec{display:flex;flex-direction:column;gap:12px;padding-block:14px 24px}
.kp-sec h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin-top:6px}
.bigcounts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigc{border-radius:22px;padding:12px 14px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.bigc b{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.bigc small{font-weight:800;font-size:14px;opacity:.95}
.bigc .st.on{fill:#fff;stroke:none}
.irow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px 12px 8px 6px;box-shadow:0 3px 0 rgba(27,35,80,.08)}
.irow .isl-svg{width:66px;height:50px;flex:none}
.irow .grow{flex:1;min-width:0}
.irow b{font-family:var(--f-display);font-size:17px;line-height:1.1}
.chunky{display:flex;gap:3px;margin-top:5px}
.chunky i{flex:1;height:12px;border-radius:4px;background:#E6EDF7}
.chunky i.on{background:var(--c)}
.irow .sc{font-family:var(--f-display);font-weight:800;font-size:17px;display:flex;align-items:center;gap:3px;color:#8A5200;font-variant-numeric:tabular-nums;flex:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:#fff;border-radius:20px;padding:10px 6px;text-align:center;box-shadow:0 3px 0 rgba(27,35,80,.08)}
.bdg .e{font-size:34px;line-height:1.1;display:block}
.bdg b{font-family:var(--f-display);font-size:14px;line-height:1.1;display:block;margin-top:2px}
.bdg small{font-size:11px;font-weight:700;color:var(--ink-2);line-height:1.2;display:block}
.bdg.off{opacity:.5;filter:grayscale(1)}
.kchips{display:flex;flex-wrap:wrap;gap:8px}
.kchip{background:#fff;border-radius:99px;padding:7px 12px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 0 rgba(27,35,80,.08)}
.kchip.green{background:var(--good-bg);color:#0C6237}
.kchip.blue{background:#E7F0FF;color:#1D3F95}
.linkbtn{font-weight:800;color:var(--ink-2);text-decoration:underline;padding:10px;font-size:14px;align-self:center}

/* ---------- tico ---------- */
.chat{display:flex;flex-direction:column;gap:10px;padding-block:14px}
.msg{max-width:84%;padding:10px 14px;border-radius:20px;font-weight:700;line-height:1.35;font-size:16px;animation:popin .2s}
.msg.t{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 3px 0 rgba(27,35,80,.07)}
.msg.k{background:var(--tico);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg .btn{margin-top:8px}
.tico-head{display:flex;align-items:center;gap:12px;padding-block:10px;background:linear-gradient(180deg,#C9F4EE,#EAF8FF)}
.tico-head .tico{width:64px;height:64px;animation:hop 2.4s ease-in-out infinite}
.tico-head b{font-family:var(--f-display);font-size:22px;line-height:1;display:block}
.tico-head small{font-weight:700;color:var(--ink-2);font-size:13px}
.qchips{display:flex;gap:8px;overflow-x:auto;padding-block:8px 6px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchip{white-space:nowrap;background:#fff;border:2.5px solid var(--tico);color:#0F7A6F;font-weight:800;border-radius:99px;padding:8px 14px;font-size:15px}
.chatbar{display:flex;gap:8px;padding-block:8px 10px;background:#fff;border-top:3px solid #D2ECFA;flex:none}
.chatbar input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:16px;border:2.5px solid var(--line);border-radius:18px;padding:10px 14px;min-height:50px}
.chatbar button{width:52px;height:50px;border-radius:16px;background:var(--tico);color:#fff;display:grid;place-items:center;flex:none}

/* ---------- área adulta ---------- */
.tshell{display:flex;flex-direction:column;height:100%;background:var(--adult-bg)}
.thead{display:flex;align-items:center;gap:10px;padding-block:12px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.thead .tt{flex:1;min-width:0}
.thead small{display:block;font-weight:800;font-size:12px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.thead h1{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.05;text-wrap:balance}
.me-btn{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;flex:none}
.tnav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 2px 8px;flex:none}
.tnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:11.5px;color:var(--ink-3);padding:4px 0}
.tnav button .bub{width:46px;height:30px;border-radius:12px;display:grid;place-items:center}
.tnav button.on{color:var(--ink)}
.tnav button.on .bub{background:#E3ECFF;color:#2F55D4}
.sec{display:flex;flex-direction:column;gap:12px;padding-block:14px 28px}
.sec>h2,.h2{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1;margin-top:8px;display:flex;align-items:center;gap:8px}
.h2 .more{margin-left:auto;font-family:var(--f-body);font-size:14px;color:#2F55D4;font-weight:800}
.card{background:#fff;border-radius:20px;padding:14px;border:1px solid var(--line)}
.card.tap{text-align:left;width:100%;display:block}
.card.tap:active{background:var(--mist)}
.hello{background:linear-gradient(135deg,#2F55D4,#4C7DF5);color:#fff;border:0;display:flex;align-items:center;gap:12px}
.hello b{font-family:var(--f-display);font-size:22px;line-height:1.1;display:block}
.hello small{font-weight:700;opacity:.9}
.hello .tico{width:58px;height:58px;margin-left:auto;flex:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}
.kpi b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.kpi small{font-weight:700;color:var(--ink-2);font-size:13px;line-height:1.25;display:block;margin-top:2px}
.kpi .delta{font-size:12px;font-weight:800;color:var(--good-dk)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.pill{font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--good-bg);color:#11703F}
.pill.warn{background:var(--try-bg);color:#9A4A00}
.pill.up{background:#E3ECFF;color:#2F55D4}
.pill.gray{background:var(--mist);color:var(--ink-2)}
.pill.live{background:#FDE4E4;color:#B4232A}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px;flex:none;overflow:hidden}
.ava .av{width:100%;height:100%;transform:scale(1.55) translateY(14%)}
.ava.k{background:#FFE9C7}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);text-align:left;width:100%;min-width:0}
.li:first-child{border-top:0}
.li b{font-weight:800;font-size:15.5px;display:block;line-height:1.2;overflow-wrap:anywhere}
.li small{font-weight:600;color:var(--ink-2);font-size:13px;display:block;line-height:1.3}
.li .chev{color:var(--ink-3)}
.bar{height:9px;background:#E7EDF7;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,#2F55D4);border-radius:inherit}
.subrow{display:grid;grid-template-columns:92px 1fr 42px;gap:10px;align-items:center;font-weight:700;font-size:14px}
.subrow b{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.dotc{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--c);margin-right:6px;vertical-align:1px}
.tchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tchips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:99px;padding:8px 14px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ins{display:flex;flex-direction:column;gap:8px}
.ins .tagrow{display:flex;align-items:center;gap:8px}
.ins .tagrow .ic{width:18px;height:18px;color:#2F55D4}
.ins h3{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.2;text-wrap:balance}
.ins p{color:var(--ink-2);font-weight:600;font-size:14.5px;line-height:1.4}
.ins .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.abtn{font-weight:800;font-size:14px;border-radius:12px;padding:9px 14px;background:#2F55D4;color:#fff;min-height:40px}
.abtn.light{background:var(--mist);color:var(--ink)}
.abtn.green{background:var(--good)}
.note{display:flex;gap:10px;align-items:flex-start;background:#EEF3FF;border-radius:16px;padding:12px 14px;color:#253D8E;font-weight:700;font-size:14px;line-height:1.4}
.note .ic{color:#2F55D4;margin-top:1px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px;line-height:1.2;text-align:center;position:relative}
.qa .qi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff}
.qa .count{position:absolute;top:6px;right:6px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.sw{width:54px;height:32px;border-radius:99px;background:#C9D2E3;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(22px)}
.subj-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--soft)}
.subj-ic .isl-svg{width:40px;height:30px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:800;font-size:14px;color:var(--ink-2)}
.field input,.field select,.field textarea,.inp{width:100%;font:inherit;font-weight:600;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;min-height:48px}
.field textarea{min-height:80px;resize:vertical}
.optrow{display:flex;align-items:center;gap:8px}
.optrow input[type=text]{flex:1;min-width:0}
.radio{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink-3);background:#fff}
.radio.on{background:var(--good);border-color:var(--good);color:#fff}
.seg{display:flex;background:var(--mist);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.preview{background:var(--soft,#EAF8FF);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.preview .qcard{padding:12px}
.preview .prompt{font-size:18px}
.preview .opts{gap:8px}
.preview .opt{min-height:48px;font-size:16px;box-shadow:0 3px 0 var(--oc,#C9D8EA)}
.preview .opt.right{box-shadow:0 3px 0 var(--good-dk)}
.lvl-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.lvl-row:first-child{border-top:0}
.lvl-row .num{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.lvl-row b{font-weight:800;font-size:15px;line-height:1.2;display:block}
.lvl-row small{font-weight:600;color:var(--ink-2);font-size:12.5px}
.mini-btn{width:36px;height:36px;border-radius:10px;background:var(--mist);display:grid;place-items:center;color:var(--ink-2);flex:none}
.mini-btn .ic{width:18px;height:18px}
.mini-btn[disabled]{opacity:.3}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-weight:700;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-weight:700;fill:var(--ink-3);font-size:11px}
.searchbox{position:relative}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:20px;height:20px}
.searchbox input{padding-left:40px}
.tico-sm{width:22px;height:22px;flex:none}

/* ---------- folhas, toast, rotação ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,20,50,.5);display:flex;align-items:flex-end;z-index:50;animation:fade .2s}
.sheet{background:#fff;width:100%;border-radius:30px 30px 0 0;padding-block:10px 22px;max-height:90%;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:#D5DCEA;margin:0 auto 12px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;text-wrap:balance}
.sheet p{color:var(--ink-2);font-weight:600;line-height:1.4}
.sheet .col{display:flex;flex-direction:column;gap:12px}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;font-weight:700;z-index:60;animation:up .25s;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;line-height:1.35}
.toast .st{width:22px;height:22px}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:24px;text-align:center}
.loading .tico{width:80px;height:80px;animation:hop 1s ease-in-out infinite}
.rotate{display:none}
@media (orientation:landscape) and (max-height:520px){
  .rotate{display:flex;position:fixed;inset:0;z-index:99;background:var(--outer);color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:24px;padding:20px}
  .rotate .phone{width:48px;height:80px;border:5px solid #fff;border-radius:12px;animation:turn 2s ease-in-out infinite}
}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-8px)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes starin{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes lid{0%{transform:rotate(0)}100%{transform:rotate(-32deg) translateY(-6px)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}30%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes turn{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

window.__educaApi=(id,status,body)=>{const w=apiWait[id];if(!w)return;delete apiWait[id];let d=null;try{d=body?JSON.parse(body):null}catch(e){d={erro:body}}
 if(status>=200&&status<300)w.res(d);else w.rej(new Error((d&&d.erro)||(status?'Erro '+status:'Sem conexão com o servidor do Educa+')))};
function api(method,path,body){
 if(BRIDGE)return new Promise((res,rej)=>{const id=String(++apiSeq);apiWait[id]={res,rej};BRIDGE.request(id,method,path,body==null?'':JSON.stringify(body))});
 return fetch(path,{method,headers:{'Content-Type':'application/json'},body:body==null?undefined:JSON.stringify(body)})
  .then(async r=>{const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){d={erro:t}}if(!r.ok)throw new Error((d&&d.erro)||('Erro '+r.status));return d},

}

 SUBJ.forEach(s=>{if(!schoolAllows(s.id,t.ano))return;const xs=st.filter(v=>v.en[s.id]!==false&&v.prog[s.id]!=null);if(xs.length)subs[s.id]=Math.round(xs.reduce((a,v)=>a+v.prog[s.id],0)/xs.length)});

 const vals=Object.values(subs);
 const sc={ok:0,warn:0,up:0};st.forEach(v=>sc[status(v)[1]]++);
 return {n:st.length,st,subs,avg:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0,acc:st.length?Math.round(st.reduce((a,v)=>a+v.acc,0)/st.length):0,main:ranked[0]?ranked[0][0]:'—',ranked,active:st.filter(v=>v.days<=5).length,sc};
}

}

 else if(k==='comparar'){let a,b;do{a=d<=1?ri(1,20):ri(20,99);b=d<=1?ri(1,20):ri(20,99)}while(a===b);Object.assign(R,{prompt:'Qual número é o MAIOR?',visual:'',options:[{l:String(a),v:String(a)},{l:String(b),v:String(b)}],answer:String(Math.max(a,b)),hint:d<=1?'Conte: o maior é o que aparece depois.':'Olhe primeiro as dezenas: quem tem mais dezenas é maior.'})}

 else if(k==='sequencia'){const st=d<=1?pick([1,2]):pick([2,5,10]);const s0=ri(1,d<=1?6:20);const seq=[s0,s0+st,s0+2*st];const ans=s0+3*st;Object.assign(R,{prompt:'Qual número vem depois?',visual:`<div class="seq">${seq.map(n=>`<span>${n}</span>`).join('')}<span class="q">?</span></div>`,options:opts3(ans,[ans+st,ans-1,ans+1]),answer:String(ans),hint:'Quanto aumenta de um número para o próximo? Some isso ao último.'})}
 else if(k==='problema'){const nm=pick(['Lia','Téo','Bia','Davi']),it=pick(['figurinhas','bolinhas de gude','lápis de cor']);const a=d<=1?ri(2,6):ri(5,12),b=d<=1?ri(1,4):ri(3,8);Object.assign(R,{prompt:`${nm} tem ${a} ${it} e ganhou mais ${b}. Quantas tem agora?`,long:true,visual:'<span class="em">🎁</span>',options:opts3(a+b,[a+b+1,a+b-1,Math.abs(a-b)]),answer:String(a+b),hint:'Ganhar é juntar. Junte as duas quantidades.'})}

const TNAV=[['t-dash','Painel','home'],['t-turmas','Turmas','users'],['t-cont','Conteúdos','book'],['t-desemp','Desempenho','chart'],['t-ins','Insights IA','spark']];
const CNAV=[['c-dash','Painel','home'],['c-profs','Professores','users'],['c-turmas','Turmas','school'],['c-ind','Indicadores','chart'],['c-ins','Insights IA','spark']];
function shell(title,body,tab,kicker=''){
 const nav=S.role==='prof'?TNAV:CNAV;
 return `<div class="tshell"><header class="thead pad">${S.stack.length?`<button class="round-btn sm" data-act="back" aria-label="Voltar">${icon('back')}</button>`:''}<div class="tt">${kicker?`<small>${kicker}</small>`:''}<h1>${title}</h1></div><button class="me-btn" data-act="menu" aria-label="Conta">${initials(S.user.nome)}</button></header>
 <main id="main" class="scroll"><div class="sec pad">${body}</div></main>
 <nav class="tnav" aria-label="Menu">${nav.map(([sc,l,ic])=>`<button class="${sc===tab?'on':''}" data-go="${sc}" data-tab="1" ${sc===tab?'aria-current="page"':''}><span class="bub">${icon(ic)}</span>${l}</button>`).join('')}</nav></div>`;
}
const avaHTML=v=>v.eq?`<span class="ava k">${avatarSVG(v.eq)}</span>`:`<span class="ava" style="background:${v.color}">${initials(v.name)}</span>`;
const subjIc=s=>`<span class="subj-ic" style="--soft:${SB[s].soft}">${islandSVG(s)}</span>`;
const smIc=n=>icon(n).replace('class="ic ','class="ic tico-sm ');
function studentLi(v,to){const st=status(v);const a=avgProg(v);return `<button class="li" data-go="${to}" data-p="${v.id}" data-name="${esc(v.name.toLowerCase())}" data-st="${st[1]}">${avaHTML(v)}<span class="grow"><b>${esc(v.name)}</b><small>${a}% de progresso · ${v.acc}% de acertos${v.diff.length?' · '+esc(v.diff[0]):''}</small><div class="bar" style="margin-top:6px;--c:#2F55D4"><i style="width:${a}%"></i></div></span><span class="pill ${st[1]}">${st[0]}</span></button>`}
const INS_TIPO={DIFICULDADE:['Dificuldade','warn','info'],AVANCO:['Avanço','up','trend'],ATENCAO:['Atenção','gray','users'],RECOMENDACAO:['Recomendação','up','spark']};
function toCard(i){
 const [tag,cls,ic]=INS_TIPO[i.tipo]||['IA','up','spark'];const feito='aplicar:Marcado como feito.';
 let acts;
 if(i.publico==='PROFESSOR'){
  if(i.idAluno)acts=[['Ver perfil','go:t-aluno:'+i.idAluno]];
  else if(i.tipo==='ATENCAO')acts=[['Ver alunos','go:t-alunos:'+i.idTurma]];
  else acts=[['Marcar como feito',i.tipo==='DIFICULDADE'?'aplicar:Marcado como feito. Quem tem essa dificuldade já vê o treino especial no mapa.':feito]];
 }else{
  if(i.tipo==='AVANCO')acts=[['Ver indicadores','go:c-ind:']];
  else if(i.tipo==='ATENCAO')acts=[['Ver alunos','go:c-alunos:']];
  else if(i.tipo==='RECOMENDACAO')acts=/revis/.test(i.titulo)?[['Revisar agora','go:c-cont:']]:[['Ver disciplinas','go:c-disc:']];
  else acts=[['Marcar como feito',feito]];
 }
 return {id:i.id,tag:i.idAluno?'Aluno':tag,cls:i.idAluno&&i.tipo==='DIFICULDADE'?'live':cls,ic,title:i.titulo,text:i.texto,acts,situacao:i.situacao};
}
function insightCard(x){
 if(x.situacao==='DISPENSADO')return '';
 const done=x.situacao==='APLICADO';
 return `<div class="card ins"><div class="tagrow">${icon(x.ic||'spark')}<span class="pill ${x.cls}">${x.tag}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p><div class="acts">${done?`<span class="pill ok">${smIc('check')} Feito</span>`:x.acts.map(([l,a],k)=>`<button class="abtn ${k?'light':''}" data-act="insAct" data-a="${esc(a)}" data-id="${x.id}">${l}</button>`).join('')+`<button class="abtn light" data-act="dismiss" data-id="${x.id}">Dispensar</button>`}</div></div>`;
}
const insightsHTML=()=>S.insights.filter(i=>i.situacao!=='DISPENSADO').map(toCard).map(insightCard).join('')||'<p class="card">Nenhum insight novo por enquanto.</p>';
const anosComTrilha=()=>Object.keys(S.trilhas).map(Number).sort((a,b)=>a-b);
const anoChips=()=>`<div class="tchips">${anosComTrilha().map(a=>`<button class="chip ${a===S.ui.ano?'on':''}" data-act="setAno" data-a="${a}">${a}º ano</button>`).join('')}</div>`;

function lineChart(ids){
 const W=340,H=210,x0=36,x1=326,y0=180,y1=14;const months=S.meses;const cols=['#2F55D4','#FF7A1A','#1FAE64','#8B5CF6','#E0533D','#EC4899','#0EA5B7','#B7791F'];
 const X=i=>x0+(x1-x0)*i/4,Y=v=>y0-(y0-y1)*v/100;
 let g='';[0,25,50,75,100].forEach(v=>{g+=`<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E3E9F4" stroke-width="1"/><text x="${x0-8}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`});
 months.forEach((m,i)=>g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${m}</text>`);
 const leg=[];
 ids.forEach(id=>{const k=S.turmas.findIndex(t=>t.id===id);const c=cols[k%cols.length];const s=series(id);g+=`<polyline points="${s.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;s.forEach((v,i)=>g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===4?5:3}" fill="${i===4?c:'#fff'}" stroke="${c}" stroke-width="2"/>`);leg.push(`<span><i style="background:${c}"></i>${esc(turmaName(id))} · ${s[4]}%</span>`)});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progresso médio por mês">${g}</svg><div class="legend">${leg.join('')}</div>`;
}

  if(k){startAct('mat',0,{reforco:true,skill:sk,title:'Treino de '+sk,rounds:Array.from({length:5},()=>genMat(k,0))})}
  else{const d=S.kid.diffs.find(x=>x.skill===sk);const s=d&&BANK[d.subj]?d.subj:'por';const b=bankRounds(s,ri(0,9));startAct(s,0,{reforco:true,skill:sk,title:'Treino de '+sk,rounds:b.filter(r=>r.skill===sk).concat(b).slice(0,5)})}},
 quit:()=>openSheet(`<div class="col" style="text-align:center;align-items:center">${ticoSVG()}<h2>Quer mesmo sair?</h2><p>Você ainda não ganhou as estrelas deste nível.</p><button class="btn block" style="--b:var(--good);--bs:var(--good-dk)" data-act="closeSheet">Continuar jogando</button><button class="btn block ghost" data-act="quitYes">Sair do nível</button></div>`),
 quitYes:()=>{closeSheet();S.act=null;back()},
 closeSheet:()=>closeSheet(),
 hint:()=>{const A=S.act;if(!A||A.locked)return;A.hints++;A.sub.scaffold=true;A.msg={t:'hint',h:'Dica do Tico',x:A.rounds[A.r].hint};renderAct()},
 pick:t=>{const A=S.act;if(!A||A.locked)return;const R=A.rounds[A.r];const j=+t.dataset.j;A.sub.no=A.sub.no||new Set();
  if(R.options[j].v===R.answer){A.sub.ok=j;correct()}else{A.sub.no.add(j);A.sub.shake=j;wrong()}},
 tile:t=>{const A=S.act;if(!A||A.locked)return;const R=A.rounds[A.r];const k=+t.dataset.k;A.sub.filled=A.sub.filled||[];const need=R.word[A.sub.filled.length];
  if(R.tiles[k]===need){A.sub.filled.push(k);if(A.sub.filled.length===R.word.length)correct();else{correctStep();renderAct()}}
  else{A.sub.shake=k;const vowel='AEIOU'.includes(need);R.hint=`A próxima letra é uma ${vowel?'vogal (A, E, I, O, U)':'consoante'}. Fale a palavra devagar.`;wrong()}},
 bin:t=>{const A=S.act;if(!A||A.locked)return;const R=A.rounds[A.r];const k=+t.dataset.k;A.sub.idx=A.sub.idx||0;A.sub.inBin=A.sub.inBin||[[],[]];const it=R.items[A.sub.idx];
  if(it[2]===k){A.sub.inBin[k].push(it);A.sub.idx++;if(A.sub.idx>=R.items.length)correct();else{correctStep();renderAct()}}
  else{A.sub.shake=k;wrong()}},
 ord:t=>{const A=S.act;if(!A||A.locked)return;const R=A.rounds[A.r];const k=+t.dataset.k;A.sub.placed=A.sub.placed||[];
  if(k===A.sub.placed.length){A.sub.placed.push(k);if(A.sub.placed.length===R.items.length)correct();else{correctStep();renderAct()}}
  else{A.sub.shake=k;wrong()}},
 toIsland:()=>{const s=S.res.s;S.stack=[{screen:'k-home',p:null},{screen:'k-ilha',p:s}];S.screen='k-niveis';S.p=s+':'+curIdx(s);render(true)},
 toShop:t=>{S.ui.shopCat=t.dataset.cat;go('k-loja',null,{tab:true})},
 shopcat:t=>{S.ui.shopCat=t.dataset.cat;render(false)},
 avcat:t=>{S.ui.avCat=t.dataset.cat;render(false)},
 equip:t=>{S.kid.eq[t.dataset.cat]=t.dataset.id;S.ui.avPop=true;salvarPersonagem();if(S.screen==='k-loja'){S.ui.avCat=t.dataset.cat;go('k-avatar',null,{tab:true});toast('Agora você está usando isso!')}else render(false)},
 setColor:t=>{S.kid.eq[t.dataset.k]=t.dataset.c;S.ui.avPop=true;salvarPersonagem();render(false)},
 buyAsk:t=>{const it=ITEMS.find(x=>x.cat===t.dataset.cat&&x.id===t.dataset.id);const can=S.kid.wallet>=it.cost;
  openSheet(`<div class="col" style="align-items:center;text-align:center">${avatarSVG({...S.kid.eq,[it.cat]:it.id},'av" style="width:140px;height:170px')}<h2>${esc(it.name)}</h2>${can?`<p>Custa <b>${it.cost} estrelas</b>. Você vai ficar com ${S.kid.wallet-it.cost}.</p><button class="btn block" style="--b:var(--mat)" data-act="buy" data-cat="${it.cat}" data-id="${it.id}">Comprar por ${it.cost} ${star()}</button><button class="btn block ghost" data-act="closeSheet">Agora não</button>`:`<p>Faltam <b>${it.cost-S.kid.wallet} estrelas</b>. Jogue mais um pouco nas ilhas!</p><button class="btn block" style="--b:var(--geo)" data-act="goWorld">Ir para o mundo</button>`}</div>`)},
 buy:t=>{const it=ITEMS.find(x=>x.cat===t.dataset.cat&&x.id===t.dataset.id);if(S.kid.wallet<it.cost)return;t.disabled=true;t.textContent='Comprando…';
  api('POST',`/api/alunos/${S.kid.id}/compras`,{parte:it.cat,codigo:it.id}).then(r=>{S.kid.wallet=r.saldo;S.kid.owned.add(key(it));S.kid.eq[it.cat]=it.id;S.kid.buys++;salvarPersonagem(true);closeSheet();S.ui.avPop=true;S.ui.avCat=it.cat;go('k-avatar',null,{tab:true});toast(`${it.name}: é sua! Já está no seu personagem.`,true)})
  .catch(e=>{t.disabled=false;t.textContent='Tentar de novo';toast(e.message)})},
 goWorld:()=>{closeSheet();go('k-home',null,{tab:true})},
 ask:t=>{const q=t.dataset.q;kidSay(q);ticoReply(q);render(false);const m=$('#main');if(m)m.scrollTop=m.scrollHeight},
 /* adulto */
 insAct:t=>{const [kind,...rest]=t.dataset.a.split(':');
  if(kind==='go'){const sc=rest[0],p=rest.slice(1).join(':');if(['t-alunos','t-aluno','c-alunos','c-cont','c-disc'].includes(sc))go(sc,p);else go(sc,null,{tab:true});return}
  const id=+t.dataset.id;t.disabled=true;
  api('PUT','/api/insights/'+id,{situacao:'APLICADO'}).then(()=>{const i=S.insights.find(x=>x.id===id);if(i)i.situacao='APLICADO';toast(rest.join(':'));render(false)}).catch(falha(t))},
 dismiss:t=>{const id=+t.dataset.id;t.disabled=true;api('PUT','/api/insights/'+id,{situacao:'DISPENSADO'}).then(()=>{const i=S.insights.find(x=>x.id===id);if(i)i.situacao='DISPENSADO';render(false);toast('Insight dispensado.')}).catch(falha(t))},
 filt:t=>{S.ui.alunosFilt=t.dataset.f;document.querySelectorAll('[data-act="filt"]').forEach(b=>b.classList.toggle('on',b===t));applyFilter()},
 tTurma:t=>{S.ui.tTurma=t.dataset.t;S.ui.dStudent=null;render(false)},
 setAno:t=>{setAno(+t.dataset.a);render(false)},
 toggleSubj:t=>{const st=S.students.find(s=>s.id===S.ui.dStudent);const s=t.dataset.s;const novo=st.en[s]===false;t.disabled=true;
  api('PUT',`/api/alunos/${st.id}/disciplinas/${s}`,{habilitada:novo,idProfessor:+S.user.id}).then(()=>{st.en[s]=novo;render(false);toast(`${SB[s].island} ${novo?'liberada':'escondida'} para ${st.name.split(' ')[0]}.`)}).catch(falha(t))},
 tSubj:t=>{S.ui.tSubj=t.dataset.s;render(false)},
 move:t=>{const s=S.ui.tSubj,L=lv(s),i=+t.dataset.i,j=i+ +t.dataset.d;if(j<0||j>=L.length)return;
  const ri={regiao:L[i].regiao,idRegiao:L[i].idRegiao},rj={regiao:L[j].regiao,idRegiao:L[j].idRegiao};
  [L[i],L[j]]=[L[j],L[i]];Object.assign(L[i],ri);Object.assign(L[j],rj);render(false);
  salvarQuieto(api('PUT',`/api/trilhas/${S.ui.ano}/${s}/ordem`,{ids:L.map(l=>l.id)}))},
 editLvl:t=>{const i=+t.dataset.i,l=lv(S.ui.tSubj)[i];S.ed2={diff:l.diff,i};openSheet(`<div class="col"><h2>Editar nível ${i+1}</h2><label class="field"><span>Nome do nível</span><input id="lv-title" value="${esc(l.title)}"></label><div class="field"><span>Dificuldade</span><div class="seg">${[1,2,3].map(d=>`<button class="${d===l.diff?'on':''}" data-act="lvDiff" data-v="${d}">${DIFF_LABEL[d]}</button>`).join('')}</div></div><button class="btn block" style="--b:#2F55D4;--bs:#1E3A9E" data-act="saveLvl">Salvar</button></div>`)},
 newLvl:()=>{S.ed2={diff:2,i:-1};openSheet(`<div class="col"><h2>Novo nível em ${SB[S.ui.tSubj].name} (${S.ui.ano}º ano)</h2><p>Ele entra no fim da trilha. Depois você pode mudar a ordem.</p><label class="field"><span>Nome do nível</span><input id="lv-title" placeholder="Ex.: Divisão com balas"></label>${S.ui.tSubj==='mat'?`<label class="field"><span>Tipo de minijogo</span><select id="lv-kind">${Object.entries(MATK).map(([k,v])=>`<option value="${k}">${cap(v)}</option>`).join('')}</select></label>`:''}<div class="field"><span>Dificuldade</span><div class="seg">${[1,2,3].map(d=>`<button class="${d===2?'on':''}" data-act="lvDiff" data-v="${d}">${DIFF_LABEL[d]}</button>`).join('')}</div></div><button class="btn block" style="--b:#2F55D4;--bs:#1E3A9E" data-act="saveLvl">Criar nível</button></div>`)},
 lvDiff:t=>{S.ed2.diff=+t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t))},
 saveLvl:t=>{const title=$('#lv-title').value.trim();if(!title){$('#lv-title').focus();toast('Dê um nome ao nível.');return}const s=S.ui.tSubj,L=lv(s);t.disabled=true;
  if(S.ed2.i<0){const kd=$('#lv-kind');api('POST','/api/niveis',{ano:S.ui.ano,disciplina:s,titulo:title,dificuldade:S.ed2.diff,tipoMinijogo:kd?kd.value:null,idAutor:+S.user.id})
    .then(l=>{const k=String(S.ui.ano);S.trilhas[k]=S.trilhas[k]||{};(S.trilhas[k][s]=S.trilhas[k][s]||[]).push(l);setAno(S.ui.ano);closeSheet();render(false);toast(`Nível ${lv(s).length} criado no fim da trilha.`)}).catch(falha(t))}
  else{const l=L[S.ed2.i];api('PUT','/api/niveis/'+l.id,{titulo:title,dificuldade:S.ed2.diff}).then(()=>{l.title=title;l.diff=S.ed2.diff;closeSheet();render(false);toast('Nível atualizado.')}).catch(falha(t))}},
 edType:t=>{S.ed.type=t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));const box=$('#ed-opts');box.querySelectorAll('.optrow').forEach((r,k)=>{r.classList.toggle('hide',S.ed.type==='tf'&&k>1);const inp=r.querySelector('input');inp.readOnly=S.ed.type==='tf';if(S.ed.type==='tf'&&k<2){inp.dataset.prev=inp.value;inp.value=['Verdadeiro','Falso'][k]}else if(S.ed.type!=='tf'&&inp.dataset.prev!=null){inp.value=inp.dataset.prev;delete inp.dataset.prev}});if(S.ed.ans>1&&S.ed.type==='tf'){S.ed.ans=0;box.querySelectorAll('.radio').forEach((b,k)=>b.classList.toggle('on',k===0))}edPreview()},
 edAns:t=>{S.ed.ans=+t.dataset.k;document.querySelectorAll('#ed-opts .radio').forEach((b,k)=>b.classList.toggle('on',k===S.ed.ans));edPreview()},
 edDiff:t=>{S.ed.diff=+t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t))},
 edSave:t=>{const v=edVals();const filled=v.options.filter(o=>o.trim());
  if(!v.prompt){toast('Escreva a pergunta antes de salvar.');$('#ed-prompt').focus();return}
  if(filled.length<2){toast('Coloque pelo menos duas opções.');return}
  if(!v.options[S.ed.ans]||!v.options[S.ed.ans].trim()){toast('A opção marcada como certa está vazia.');return}
  const nivel=lv(v.subj)[v.level];if(!nivel){toast('Essa ilha ainda não tem níveis neste ano.');return}
  t.disabled=true;
  api('POST','/api/questoes',{idAtividade:nivel.id,enunciado:v.prompt,tipo:S.ed.type,alternativas:v.options,correta:S.ed.ans,dica:v.hint,idAutor:+S.user.id})
  .then(c=>{S.custom.push(c);S.ui.tSubj=v.subj;back();toast(c.status==='Publicado'?`Publicada no Nível ${v.level+1} de ${SB[v.subj].name}.`:`Salva no Nível ${v.level+1} de ${SB[v.subj].name}. Os alunos das suas turmas já veem; a coordenação revisa para o resto da escola.`)}).catch(falha(t))},
 perfTurma:t=>{S.ui.perfTurma=t.dataset.t;render(false)},
 addStudent:t=>{const tid=t.dataset.t;if(!tid){toast('Você ainda não tem turma.');return}openSheet(`<div class="col"><h2>Adicionar aluno ao ${esc(turmaName(tid))}</h2><label class="field"><span>Nome completo</span><input id="ns-name" placeholder="Ex.: Ana Beatriz Ramos"></label><label class="field"><span>E-mail Google da escola (opcional)</span><input id="ns-mail" type="email" placeholder="nome@aluno.escolahorizonte.edu.br"></label><p>O aluno entra com esse e-mail e cai direto no mapa dele.</p><button class="btn block" style="--b:#2F55D4;--bs:#1E3A9E" data-act="saveStudent" data-t="${tid}">Adicionar</button></div>`)},
 saveStudent:t=>{const name=$('#ns-name').value.trim();if(!name){$('#ns-name').focus();toast('Digite o nome do aluno.');return}t.disabled=true;
  api('POST','/api/alunos',{nome:name,email:$('#ns-mail').value.trim()||null,idTurma:+t.dataset.t}).then(st=>{st.color=AVC[S.students.length%AVC.length];S.students.push(st);const tm=S.turmas.find(x=>x.id===st.turma);if(tm)tm.n++;closeSheet();render(false);toast(`${name.split(' ')[0]} entrou no ${turmaName(st.turma)}.`)}).catch(falha(t))},
 /* coordenação */
 invite:()=>openSheet(`<div class="col"><h2>Convidar professor</h2><label class="field"><span>Nome</span><input id="np-name" placeholder="Nome completo"></label><label class="field"><span>E-mail Google</span><input id="np-mail" type="email" placeholder="nome@escolahorizonte.edu.br"></label><label class="field"><span>Área</span><input id="np-area" value="Polivalente"></label><button class="btn block" style="--b:#2F55D4;--bs:#1E3A9E" data-act="saveInvite">Cadastrar</button></div>`),
 saveInvite:t=>{const n=$('#np-name').value.trim(),m=$('#np-mail').value.trim();if(!n||!m){toast('Preencha nome e e-mail.');return}t.disabled=true;
  api('POST','/api/professores',{nome:n,email:m,area:$('#np-area').value}).then(p=>{S.profs.push(p);closeSheet();render(false);toast(`${n} cadastrado. Ele entra com esse e-mail Google.`)}).catch(falha(t))},
 newTurma:()=>openSheet(`<div class="col"><h2>Nova turma</h2><label class="field"><span>Nome</span><input id="nt-name" placeholder="Ex.: 2º B"></label><label class="field"><span>Ano</span><select id="nt-ano">${[1,2,3,4,5].map(a=>`<option value="${a}">${a}º ano</option>`).join('')}</select></label><label class="field"><span>Professor</span><select id="nt-prof">${S.profs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><button class="btn block" style="--b:#2F55D4;--bs:#1E3A9E" data-act="saveTurma">Criar turma</button></div>`),
 saveTurma:t=>{const n=$('#nt-name').value.trim();if(!n){$('#nt-name').focus();toast('Dê um nome à turma.');return}t.disabled=true;
  api('POST','/api/turmas',{nome:n,ano:+$('#nt-ano').value,idProfessor:+$('#nt-prof').value}).then(tm=>{S.turmas.push(tm);S.minhas.push(tm.id);S.series[tm.id]=[0,0,0,0,0];const p=S.profs.find(x=>x.id===tm.prof);if(p)p.turmas.push(tm.id);closeSheet();render(false);toast(`Turma ${n} criada.`)}).catch(falha(t))},
 cTurma:t=>{S.ui.cAlunosTurma=t.dataset.t;render(false)},
 schoolSubj:t=>{const s=t.dataset.s;const novo=(S.school.anos[s]||[]).length?[]:[1,2,3,4,5].filter(a=>s!=='ing'||a>=3);putAnos(s,novo,`${SB[s].name} ${novo.length?'ativada':'desativada'} na escola.`)},
 schoolAno:t=>{const s=t.dataset.s,a=+t.dataset.a;const arr=(S.school.anos[s]||[]).slice();const k=arr.indexOf(a);if(k>=0)arr.splice(k,1);else{arr.push(a);arr.sort((x,y)=>x-y)}putAnos(s,arr)},
 cSubj:t=>{S.ui.cSubj=t.dataset.s;render(false)},
 openTCont:()=>{S.ui.tSubj=S.ui.cSubj;go('t-cont')},
 approve:t=>situacaoQuestao(t,'PUBLICADA','Publicado','Atividade aprovada para todas as turmas.'),
 reject:t=>situacaoQuestao(t,'RECUSADA','Recusada'),
 indSel:t=>{const id=t.dataset.t,a=S.ui.indSel;const k=a.indexOf(id);if(k>=0)a.splice(k,1);else{if(a.length>=4)a.shift();a.push(id)}render(false)},
};

document.addEventListener('click',e=>{
 const sc=e.target.closest('#scrim');if(sc&&e.target===sc){closeSheet();return}
 const t=e.target.closest('[data-go],[data-act]');if(!t||t.disabled)return;
 if(t.dataset.go){closeSheet();go(t.dataset.go,t.dataset.p??null,{tab:!!t.dataset.tab});return}
 const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='chatForm'){e.preventDefault();const i=$('#chatIn');const q=i.value.trim();if(!q)return;kidSay(q);ticoReply(q);render(false);const m=$('#main');if(m)m.scrollTop=m.scrollHeight;const i2=$('#chatIn');if(i2)i2.focus()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='q')applyFilter();
 if(e.target.closest&&e.target.closest('#main')&&S.screen==='t-editor')edPreview();
});
document.addEventListener('change',e=>{
 if(e.target.id==='dStu'){S.ui.dStudent=e.target.value;render(false)}
 if(e.target.id==='ed-subj'){const s=e.target.value;$('#ed-level').innerHTML=lv(s).map((l,i)=>`<option value="${i}">Nível ${i+1}: ${esc(l.title)}</option>`).join('');edPreview()}
 if(e.target.id==='ed-level')edPreview();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
// Botão voltar do Android: fecha a folha aberta, sai do nível ou volta uma tela. Devolve false quando não há para onde voltar.
window.educaVoltar=()=>{if($('#scrim')){closeSheet();return true}if(S.screen==='k-ativ'){ACT.quit();return true}if(S.stack.length){back();return true}return false};
if(BRIDGE)entrar(BRIDGE.usuarioId());else render(true);
</script>
